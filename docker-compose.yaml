
services:
  postgres:
    image: postgres:16-alpine
    container_name: olist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olist}
      POSTGRES_USER: ${POSTGRES_USER:-olist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diatur di .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    container_name: olist-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    mem_limit: 640m

  minio:
    image: quay.io/minio/aistor/minio
    container_name: olist-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER belum diatur di .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD belum diatur di .env}
    volumes:
      - minio_data:/data

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: olist-jupyter
    profiles: ["tools"]
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./outputs:/home/jovyan/outputs
    mem_limit: 1g

  
  spark-master:
    image: apache/spark:3.5.0
    container_name: olist-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    restart: unless-stopped
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ./data:/opt/project/data
      - ./outputs:/opt/project/outputs
      - ./src:/opt/project/src:ro
    mem_limit: 768m

  spark-worker:
    image: apache/spark:3.5.0
    container_name: olist-spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_MEMORY: 768m
      SPARK_WORKER_CORES: "1"
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - ./data:/opt/project/data
      - ./outputs:/opt/project/outputs
      - ./src:/opt/project/src:ro
    mem_limit: 1g


volumes:
  postgres_data:
  kafka_data:
  minio_data:
